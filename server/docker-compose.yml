# The Borg: server di gioco in locale (Nakama + PostgreSQL)
#   cd server && docker compose up
# Poi il gioco si collega con ?amici=<codice>&server=127.0.0.1:7350
# Console di amministrazione: http://127.0.0.1:7351 (admin / password, solo in locale)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.40.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
    volumes:
      - ./nakama/local.yml:/nakama/data/local.yml:ro
      - ./nakama/modules:/nakama/data/modules:ro
    ports:
      - "7350:7350"   # API e websocket del gioco
      - "7351:7351"   # console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dati:
