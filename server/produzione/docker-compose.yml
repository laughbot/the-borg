# The Borg: server di gioco online (Nakama + PostgreSQL + Caddy per HTTPS)
#
# Gira sul VPS, avviato da installa.sh. Non contiene segreti: chiavi e password
# stanno in /etc/the-borg/.env sul server (creato da installa.sh, mai nel repo).
#
#   docker compose --env-file /etc/the-borg/.env -f server/produzione/docker-compose.yml up -d
#
# Indirizzi (DOMINIO e' per esempio 1-2-3-4.sslip.io finche' non c'e' il dominio vero):
#   https://DOMINIO           API e websocket del gioco
#   https://console.DOMINIO   console di amministrazione di Nakama
# Solo Caddy e' raggiungibile da fuori (porte 80 e 443); Nakama e PostgreSQL no.
name: the-borg

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${DB_PASSWORD:?manca DB_PASSWORD in /etc/the-borg/.env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 3s
      retries: 20

  nakama:
    image: heroiclabs/nakama:3.40.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        /nakama/nakama migrate up --database.address "postgres:${DB_PASSWORD}@postgres:5432/nakama" &&
        exec /nakama/nakama --config /nakama/data/produzione.yml
        --database.address "postgres:${DB_PASSWORD}@postgres:5432/nakama"
        --session.encryption_key "${SESSIONE_CHIAVE:?manca SESSIONE_CHIAVE}"
        --session.refresh_encryption_key "${SESSIONE_RINNOVO_CHIAVE:?manca SESSIONE_RINNOVO_CHIAVE}"
        --runtime.http_key "${RUNTIME_HTTP_KEY:?manca RUNTIME_HTTP_KEY}"
        --console.password "${CONSOLE_PASSWORD:?manca CONSOLE_PASSWORD}"
        --console.signing_key "${CONSOLE_FIRMA:?manca CONSOLE_FIRMA}"
    volumes:
      - ./nakama.yml:/nakama/data/produzione.yml:ro
      - ../nakama/modules:/nakama/data/modules:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - nakama
    environment:
      DOMINIO: ${DOMINIO:?manca DOMINIO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dati:/data
      - caddy_config:/config

volumes:
  database:
  caddy_dati:
  caddy_config:
