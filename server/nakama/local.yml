# Configurazione Nakama per lo sviluppo in locale.
# In produzione chiavi e password arrivano da variabili d'ambiente sul server, mai da questo file.
name: the-borg
logger:
  level: INFO
runtime:
  js_entrypoint: the-borg.js
session:
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 2592000
socket:
  server_key: defaultkey
  max_message_size_bytes: 32768   # la presenza arriva in base64: 8 KB di dati sono ~11 KB di messaggio
match:
  max_empty_sec: 0
console:
  username: admin
  password: password
